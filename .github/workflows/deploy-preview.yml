## Publishes site/ to GitHub Pages as a CLIENT PREVIEW.
##
## The noindex meta tag and robots.txt are injected HERE, at build time, and are
## deliberately NOT in the source files. A Pages site served from a private repo
## is still publicly reachable by URL (private Pages access control is Enterprise
## Cloud only), so the preview needs crawler protection — but the real site at
## sbvwm.com must never inherit it. Keeping the tag out of the repo means there is
## no way to accidentally ship a noindex to production.
##
## Paths in the site are relative, so serving from the /sbvwm-site/ subpath works
## without a base-href rewrite.

name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: cp -r site _site

      - name: Mark as preview — keep it out of search results
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          find _site -name '*.html' -exec \
            sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' {} +

      - name: Skip Jekyll processing
        run: touch _site/.nojekyll

      - name: Verify the injection actually landed
        run: |
          missing=0
          while IFS= read -r f; do
            grep -q 'name="robots" content="noindex' "$f" || { echo "NO NOINDEX: $f"; missing=1; }
          done < <(find _site -name '*.html')
          test "$missing" -eq 0 || { echo "::error::noindex injection failed"; exit 1; }
          echo "noindex present in all HTML files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
