## Publishes site/ to GitHub Pages, in one of two modes.
##
## The mode is decided by the repository variable PROD_HOST, NOT by editing this file:
##
##   unset  -> PREVIEW. No CNAME, and a noindex meta tag plus a blocking robots.txt are
##             injected at build time. A Pages site from this repo is publicly reachable
##             by URL, so an unfinished preview must never be indexed.
##   set     -> PRODUCTION at that hostname. Emits CNAME, a crawlable robots.txt and a
##             sitemap, and fails the build if a noindex ever reaches the output.
##
## Why a variable and not a code change: the CNAME file is what actually attaches the
## custom domain, and it is re-asserted on every deploy. Removing the domain in the Pages
## UI or API therefore does not stick - the next deploy puts it back. Flipping the switch
## has to be the same action as flipping the DNS, or the two drift apart and the preview
## link starts redirecting at a domain that still serves the old site.
##
## To go live:   gh variable set PROD_HOST --body www.sbvwm.com   (then change DNS)
## To roll back: gh variable delete PROD_HOST                     (then revert DNS)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROD_HOST: ${{ vars.PROD_HOST }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: cp -r site _site

      - name: Report which mode this build is in
        run: |
          if [ -n "$PROD_HOST" ]; then
            echo "PRODUCTION build for $PROD_HOST"
          else
            echo "PREVIEW build - no custom domain, noindex will be injected"
          fi

      - name: Preview — keep it out of search results
        if: ${{ vars.PROD_HOST == '' }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          find _site -name '*.html' -exec \
            sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' {} +

      - name: Production — attach the domain, invite crawlers
        if: ${{ vars.PROD_HOST != '' }}
        run: |
          printf '%s\n' "$PROD_HOST" > _site/CNAME
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://%s/sitemap.xml\n' "$PROD_HOST" > _site/robots.txt
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            printf '  <url><loc>https://%s/</loc><priority>1.0</priority></url>\n' "$PROD_HOST"
            printf '  <url><loc>https://%s/privacy-policy/</loc><priority>0.3</priority></url>\n' "$PROD_HOST"
            printf '</urlset>\n'
          } > _site/sitemap.xml

      - name: Skip Jekyll processing
        run: touch _site/.nojekyll

      - name: Verify the build matches its mode
        run: |
          noindexed=$(grep -rl 'content="noindex' _site --include='*.html' | wc -l)
          total=$(find _site -name '*.html' | wc -l)
          if [ -n "$PROD_HOST" ]; then
            [ "$noindexed" -eq 0 ] || { echo "::error::a noindex reached the production build — the live site would be delisted"; exit 1; }
            grep -q '^Allow: /' _site/robots.txt || { echo "::error::robots.txt is not allowing crawlers"; exit 1; }
            [ "$(cat _site/CNAME)" = "$PROD_HOST" ] || { echo "::error::CNAME does not match PROD_HOST"; exit 1; }
            echo "production OK: no noindex, robots allows, CNAME=$PROD_HOST"
          else
            [ "$noindexed" -eq "$total" ] || { echo "::error::preview build is missing noindex on some pages"; exit 1; }
            [ ! -f _site/CNAME ] || { echo "::error::preview build must not carry a CNAME"; exit 1; }
            grep -q '^Disallow: /' _site/robots.txt || { echo "::error::preview robots.txt is not blocking crawlers"; exit 1; }
            echo "preview OK: noindex on all $total pages, no CNAME, robots blocks"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
